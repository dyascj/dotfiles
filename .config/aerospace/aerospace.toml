########################################
# AeroSpace: tiling with an off switch
# Five workspaces, a free mode that floats everything like stock macOS,
# and a handful of Option shortcuts. The bar can do all of it with clicks.
########################################

config-version = 2
start-at-login = true
after-startup-command = ['exec-and-forget sketchybar --trigger aerospace_change']

persistent-workspaces = ['1', '2', '3', '4', '5']

# Tell the bar whenever focus, a workspace, or the windows in it change
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_change']

# The bar and helper scripts live in Homebrew's bin
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# Line windows up with the bar: 10pt everywhere, and room under the bar on top.
# The built-in screen already keeps 32pt for the notch, others keep nothing.
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.right = 10
outer.bottom = 10
outer.top = [{ monitor.'built-in' = 14 }, 46]

[mode.main.binding]
# workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-tab = 'workspace-back-and-forth'
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'

# tiling
alt-t = 'exec-and-forget ~/.config/aerospace/mode.sh toggle'
alt-f = 'layout floating tiling'
alt-enter = 'fullscreen'
alt-slash = 'layout tiles horizontal vertical'
alt-equal = 'exec-and-forget ~/.config/aerospace/mode.sh tidy' # smart stack and even out

# Option alone stays free for jumping by word in text, so moving windows adds Control
ctrl-alt-left = 'move left'
ctrl-alt-down = 'move down'
ctrl-alt-up = 'move up'
ctrl-alt-right = 'move right'

# Settings windows float. Other new windows get smart stacked, or float in free mode.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if = 'true'
run = 'exec-and-forget ~/.config/aerospace/mode.sh adopt'
