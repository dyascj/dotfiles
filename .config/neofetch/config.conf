# neofetch, in Ash: the logo and title in white, labels in grey,
# values in the text color, and the palette underneath

print_info() {
    info title
    # neofetch 7.1 counts the title's color codes on macOS's bash, so measure it again
    length=$((${#user} + ${#hostname} + 1))
    info underline

    info "OS" distro
    # neofetch 7.1 predates the M4 Macs, so ask macOS for the model name
    prin "Host" "$(system_profiler SPHardwareDataType | awk -F': ' '/Model Name|Chip/ {printf "%s ", $2}')"
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    prin "WM" "AeroSpace"
    prin "Bar" "SketchyBar"
    prin "Theme" "Ash"
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    info cols
}

# Colors are ANSI palette numbers from ash.conf: 15 white, 8 dark grey,
# 7 light grey. Order: title, @, underline, label, colon, value.
colors=(15 8 8 7 8 fg)
bold="on"
underline_char="-"
separator=":"

os_arch="off"
uptime_shorthand="tiny"
memory_percent="on"

# The palette row: all 16 colors, the grey ramp then the pastels
block_range=(0 15)
block_width=3

image_backend="ascii"
image_source="$HOME/.config/neofetch/ascii.txt"
ascii_colors=(15)
gap=4
